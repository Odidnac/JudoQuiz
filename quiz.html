<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>🥋 Judo Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://cdn.jsdelivr.net/npm/daisyui@4.12.22/dist/full.min.css"
        rel="stylesheet">
    <link rel="icon" href="data:,">
</head>

<body class="bg-base-200 min-h-screen">
    <!-- Navbar -->
    <div class="navbar bg-primary text-primary-content">

        <div class="flex-1">
            <span class="text-xl font-bold">
                🥋 Judo Quiz
            </span>
        </div>

        <div class="flex-none gap-2">
            <button
                class="btn btn-warning btn-sm"
                onclick="confirmRestart()">
                Restart
            </button>

            <button
                class="btn btn-error btn-sm"
                onclick="logout()">
                Logout
            </button>
        </div>
    </div>

    <!-- Área Principal -->
    <div
        id="gameContent"
        class="max-w-4xl mx-auto p-3">
    </div>

    <!-- Dialog Confirmação -->
    <dialog
        id="confirmDialog"
        class="modal">

        <div class="modal-box">
            <h3
                id="confirmTitle"
                class="font-bold text-lg">
                Confirmação
            </h3>

            <p
                id="confirmText"
                class="py-4">
                Tem a certeza?
            </p>

            <div class="modal-action">
                <button
                    class="btn btn-primary"
                    id="confirmYes">
                    Sim
                </button>

                <button
                    class="btn"
                    onclick="closeConfirmDialog()">
                    Não
                </button>
            </div>
        </div>
    </dialog>

    <dialog
    id="hansokuModal"
    class="modal">

        <div class="modal-box">
            <h3 class="font-bold text-3xl text-error">
                🥋 HANSOKU-MAKE
            </h3>
            
            <!-- IMAGEM -->
    
            <div class="my-4 flex justify-center">
                <img
                    src="images/Hansoku-Make.png"
                    alt="Hansoku-Make"
                   class="rounded-lg shadow-lg w-full max-w-xs">
            </div>
            
            <p class="py-4">
                Acumulaste 3 Shidos.
            </p>
    
            <div class="modal-action">
                <button
                    class="btn btn-primary"
                    onclick="restartGame()">
                    Novo Jogo
                </button>
    
                <button
                    class="btn"
                    onclick="logout()">
                    Sair
                </button>
            </div>
        </div>
    </dialog>

    <dialog
        id="shidoModal"
        class="modal">
    
        <div class="modal-box text-center">
            <h3 class="text-4xl font-bold text-warning">
                ⚠️ SHIDO!
            </h3>
            
            <img
            src="images/Hansoku-Make.png"
            class="mx-auto my-4 rounded-lg">
            
        </div>
    </dialog>

    <dialog
    id="hansokuModal"
    class="modal">
        <div class="modal-box text-center">
            <h3
                class="font-bold text-3xl text-error">
                🥋 HANSOKU-MAKE
            </h3>
            <div class="my-4">
                <img
                    src="images/Hansoku-Make.png"
                    alt="Hansoku-Make"
                    class="mx-auto rounded-lg shadow-lg max-w-xs">
            </div>
            <p
                class="py-2 text-lg">
                Acumulaste 3 Shidos. Foste eliminado deste torneio!
            </p>
            <div
                id="hansokuStats"
                class="my-4">
            </div>
            <div class="modal-action justify-center">
                <button
                    class="btn btn-primary"
                    onclick="restartGame()">
                    Novo Jogo
                </button>
    
                <button
                    class="btn btn-outline"
                    onclick="logout()">
                    Sair
                </button>
            </div>
        </div>
    </dialog>

    <dialog
    id="decisionModal"
    class="modal">

    <div class="modal-box text-center">
        <h3
            id="decisionTitle"
            class="font-bold text-3xl">
        </h3>

        <div class="my-4">
            <img
                id="decisionImage"
                src=""
                class="mx-auto rounded-lg shadow-lg max-w-xs">
        </div>
    </div>
</dialog>
    
    <script src="js/quiz.js?v=1"></script>
</body>

</html>
