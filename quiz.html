<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<title>Quiz</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="icon" href="data:,">

<link
href="https://cdn.jsdelivr.net/npm/daisyui@4.12.22/dist/full.min.css"
rel="stylesheet">

</head>

<body class="bg-base-200">

<div class="container mx-auto mt-10">

<div class="card bg-base-100 shadow-xl">

    <div class="card-body">

        <div class="flex justify-between">

            <div
                id="shidos"
                class="flex gap-2">
            </div>

            <span id="score">
                0
            </span>

        </div>

        <h2
            id="question"
            class="text-2xl font-bold mt-3">
        </h2>

        <div
            id="questionArea"
            class="mt-5">
        </div>

    </div>

</div>

</div>

<script>

document.getElementById("nome")
.innerHTML =
localStorage.getItem("playerName");

const playerName =
    localStorage.getItem("playerName");

const playerCode =
    localStorage.getItem("playerCode");

if (
    playerName === null
    ||
    playerCode === null
)
{
    window.location = "index.html";
}
else
{
    document.getElementById("nome")
        .innerHTML = playerName;
}

</script>

</body>

</html>
