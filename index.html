<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">

    <title>🥋 Judo Quiz</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.22/dist/full.min.css"
          rel="stylesheet" />
</head>

<body class="bg-base-200 min-h-screen">

    <div class="navbar bg-primary text-primary-content">
        <a class="btn btn-ghost text-xl">
            🥋 Judo Quiz
        </a>
    </div>

    <div class="flex justify-center mt-10">

        <div class="card bg-base-100 shadow-xl w-full max-w-3xl">

            <div class="card-body">

                <h2 class="card-title">
                    Pergunta
                </h2>

                <div id="question" class="text-xl mb-4"></div>

                <div id="answers" class="space-y-2"></div>

                <div class="mt-6">

                    <progress
                        id="progress"
                        class="progress progress-primary w-full"
                        value="0"
                        max="100">
                    </progress>

                </div>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
