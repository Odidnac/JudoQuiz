<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>🥋 Judo Quiz</title>

    <link
        rel="icon"
        href="data:,">

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://cdn.jsdelivr.net/npm/daisyui@4.12.22/dist/full.min.css"
        rel="stylesheet">

</head>

<body class="bg-base-200">
    <div class="hero min-h-screen">
        <div class="hero-content w-full px-4">
            <div class="card bg-base-100 shadow-xl w-full max-w-md">
                <div class="card-body">
                    <h1
                        class="text-2xl md:text-3xl font-bold text-center">
                        🥋 Judo Trivial
                    </h1>

                    <input
                        id="txtNome"
                        class="input input-bordered w-full"
                        placeholder="Nome">
                  
                    <input
                        id="txtCodigo"
                        class="input input-bordered w-full"
                        placeholder="Código">
                  
                    <button
                        class="btn btn-primary w-full"
                        onclick="login()">
                        Entrar
                    </button>

                    <div
                        id="erro"
                        class="text-error">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
